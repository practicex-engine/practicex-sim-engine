# 수동으로 시계를 한 번만 전진시킵니다(자동 반복은 engine-loop). 같은 대기열(engine-run)을 쓰므로 반복과 겹쳐 돌지 않습니다.
name: engine-tick

# 예약 실행은 GitHub 사정으로 몇 분~수십 분 늦거나 빠질 수 있습니다. 시계는 실제 경과 시간으로 계산하므로 지연은 문제 없고,
# 빠진 날은 따라잡지 않고 오류·누락 로그에 기록합니다(확정).
# 멈추려면 Notion 엔진 상태 표의 '가상 시계' 상태를 '정지'로 바꾸거나, 이 워크플로를 Actions 탭에서 Disable 하세요.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-run
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 시계 전진
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python -m engine.sync step
