name: engine-loop

# 가상 시계를 2분마다 전진시키는 반복 작업입니다. GitHub의 예약(cron)은 늦거나 빠지는 일이 잦아서,
# 이 작업이 약 5시간 30분 동안 스스로 반복하다가 끝나기 전에 자기 자신을 다시 실행해 이어 갑니다.
# 시계는 실제 경과 시간으로 계산하므로 반복 간격이 흔들려도 가상 날짜는 어긋나지 않습니다.
# 매시 17분의 예약은 사슬이 끊겼을 때 다시 붙이는 보조 장치입니다(이미 돌고 있으면 대기열에서 하나로 합쳐집니다).
# 멈추려면 Notion 엔진 상태 표의 '가상 시계' 상태를 '정지'로 바꾸세요. 반복이 그 상태를 읽고 스스로 끝납니다.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: engine-run
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 시계 전진 반복
        id: loop
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          end=$(( $(date +%s) + 5*3600 + 30*60 ))
          stop=0
          while [ "$(date +%s)" -lt "$end" ]; do
            if out=$(python -m engine.sync step 2>&1); then
              echo "$(date -u +%H:%M:%S) $(echo "$out" | tail -1 | cut -c1-300)"
              if echo "$out" | tail -1 | grep -q '"skipped"'; then stop=1; break; fi
            else
              echo "$(date -u +%H:%M:%S) 실패: $(echo "$out" | tail -3 | cut -c1-300)"
            fi
            sleep 120
          done
          echo "stop=$stop" >> "$GITHUB_OUTPUT"
      - name: 다음 반복 예약
        if: steps.loop.outputs.stop != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run engine-loop.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"
